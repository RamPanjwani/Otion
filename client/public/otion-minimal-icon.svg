<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Isolated Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- 
    Master UI Icon: Otion Document & Collaboration Flow
    Style: Bold Solid Fill Monochromatic UI Icon
    Color: Flat Solid Black (#000000) on Pure White (#ffffff)
    Aesthetic: Modern, friendly, prominently rounded corners, zero outlines, zero gradients, zero shadows
  -->

  <!-- Document Silhouette -->
  <g fill="#000000">
    <!-- Main Body with Fold Angle -->
    <path d="M 148 64
             L 296 64
             C 308 64 320 69 328 77
             L 403 152
             C 411 160 416 172 416 184
             L 416 400
             C 416 426.5 394.5 448 368 448
             L 144 448
             C 117.5 448 96 426.5 96 400
             L 96 112
             C 96 85.5 117.5 64 144 64 Z" />

    <!-- Folded Corner Flap (Separated by negative space) -->
    <path d="M 332 64
             C 332 64 332 148 332 148
             C 332 152 336 156 340 156
             L 416 156
             C 416 156 340 72 332 64 Z" />
  </g>

  <!-- Precision Negative Space Channels & Flow Lines (Pure White #ffffff) -->
  <g fill="#ffffff">
    <!-- Fold Separation Incision -->
    <path d="M 312 60
             L 312 168
             C 312 174 318 180 324 180
             L 420 180
             L 420 164
             L 332 164
             L 332 60 Z" />

    <!-- Title Bar (Header Note Flow) -->
    <rect x="152" y="224" width="208" height="32" rx="16" />

    <!-- Body Line 1 -->
    <rect x="152" y="284" width="160" height="32" rx="16" />

    <!-- Body Line 2 / Interactive Cursor Pill -->
    <rect x="152" y="344" width="96" height="32" rx="16" />

    <!-- Active Collaboration Node Dot -->
    <circle cx="288" cy="360" r="16" />
  </g>
</svg>