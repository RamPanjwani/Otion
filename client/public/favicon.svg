<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Isolated Pure White Background (1:1 Square) -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- 
    Otion Note-Taking & Study Squircle App Icon (1024x1024)
    Design System:
    - Bold circular "O" monogram (Otion brand mark)
    - Ruled study note lines (note-taking and studying metaphor)
    - Sleek study pencil actively writing into the "O"
    - Pure Black & White Monochromatic UI Icon (#000000 & #ffffff)
    - Zero gradients, zero blurs, zero paper fold, zero camera resemblance
  -->

  <!-- Solid Black Squircle Container -->
  <rect x="128" y="128" width="768" height="768" rx="192" ry="192" fill="#000000" />

  <g>
    <!-- Bold Circular "O" Ring (Optically centered at 492, 524 to balance the pencil) -->
    <path fill-rule="evenodd" d="
      M 492 284 
      C 624.5 284 732 391.5 732 524 
      C 732 656.5 624.5 764 492 764 
      C 359.5 764 252 656.5 252 524 
      C 252 391.5 359.5 284 492 284 Z

      M 492 396 
      C 421.3 396 364 453.3 364 524 
      C 364 594.7 421.3 652 492 652 
      C 562.7 652 620 594.7 620 524 
      C 620 453.3 562.7 396 492 396 Z
    " fill="#ffffff" />

    <!-- 3 Ruled Notebook Study Lines (White) -->
    <rect x="416" y="460" width="152" height="26" rx="13" fill="#ffffff" />
    <rect x="416" y="512" width="152" height="26" rx="13" fill="#ffffff" />
    <rect x="416" y="564" width="104" height="26" rx="13" fill="#ffffff" />

    <!-- 
      Study Pencil:
      Positioned at top-right (angled at 45°), writing notes directly into the "O".
      The negative space channel creates a crisp separation gap across the "O" loop.
    -->
    <g transform="translate(638, 376) rotate(45)">
      <!-- Black Negative Space Cutout Outline -->
      <path d="M -34 -170 L 34 -170 L 34 16 L 0 76 L -34 16 Z" 
            stroke="#000000" stroke-width="24" stroke-linejoin="round" fill="#000000" />
      
      <!-- Solid White Pencil Shaft -->
      <rect x="-26" y="-160" width="52" height="172" rx="4" fill="#ffffff" />
      
      <!-- Sharpened Cone Tip (White) -->
      <polygon points="-26,12 26,12 0,66" fill="#ffffff" />

      <!-- Precision Black Internal Details -->
      <!-- Eraser Ferrule Band -->
      <rect x="-30" y="-124" width="60" height="12" fill="#000000" />
      <!-- Graphite Writing Lead Tip -->
      <polygon points="-11,40 11,40 0,66" fill="#000000" />
    </g>
  </g>
</svg>