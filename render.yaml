# Render Blueprint for the Otion API.
#
# Deployed directly from the prebuilt Docker Hub container image
# (docker.io/rampanjwani/otion-server:latest) instead of building from GitHub source.

services:
  - type: web
    name: otion-api
    runtime: image
    image:
      url: docker.io/rampanjwani/otion-server:latest
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CLIENT_URLS
        value: https://otion-nine.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Optional: set it to enable Sentry error reporting; unset means no events.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
