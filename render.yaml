# Render Blueprint for the Otion API.
#
# The web client is a static Vite build served by Vercel (client/vercel.json), so
# only the backend is described here. Secret values are declared with `sync: false`:
# Render prompts for them on a new Blueprint instance and keeps the dashboard values
# on an existing one, so no credentials live in the repository.
#
# The service already exists (autoDeploy from GitHub `main`), so applying this is
# only needed to re-create it. Apply with: Render Dashboard -> Blueprints -> New
# Blueprint Instance.
# Migrations are idempotent (`npm run migrate`); run them once per release from the
# Render Shell or locally against the production URI. A `preDeployCommand` would
# automate that but requires a paid instance type.

services:
  - type: web
    name: otion-api
    runtime: node
    rootDir: server
    # Pinned to match the live otion-api service; leaving it out would provision a
    # Blueprint service in Render's default region instead of Singapore.
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_URLS
        value: https://otion-nine.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
