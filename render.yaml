# Render Blueprint for Otion Full-Stack Cloud Deployment.
#
# Both Backend and Frontend services deploy directly from pre-built,
# immutable Docker Hub container images:
# - Backend API:  docker.io/rampanjwani/otion-server:latest
# - Frontend Web: docker.io/rampanjwani/otion-client:latest

services:
  - type: web
    name: otion-api
    runtime: image
    image:
      url: docker.io/rampanjwani/otion-server:latest
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CLIENT_URLS
        value: https://otion-nine.vercel.app,https://otion-client.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Optional: set it to enable Sentry error reporting; unset means no events.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false

  - type: web
    name: otion-client
    runtime: image
    image:
      url: docker.io/rampanjwani/otion-client:latest
    region: singapore
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"
