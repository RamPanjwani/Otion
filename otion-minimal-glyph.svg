<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Isolated Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- 
    Master UI Icon: Otion 'O' Monogram & Workspace Portal
    Style: Bold Solid Fill Monochromatic UI Icon
    Color: Flat Solid Black (#000000) on Pure White (#ffffff)
    Aesthetic: Modern, friendly, prominent rounded corners, optical safe-zone centering
    Zero gradients, zero strokes, zero color blending, zero opacity
  -->

  <!-- Outer Solid Silhouette -->
  <g fill="#000000">
    <!-- Main Outer Squircle / Rounded Frame -->
    <rect x="76" y="76" width="360" height="360" rx="96" />
  </g>

  <!-- Precision Negative Space Channels -->
  <g fill="#ffffff">
    <!-- Inner Portal / Note Negative Space Window -->
    <rect x="160" y="160" width="192" height="192" rx="48" />

    <!-- Top-Right Diagonal Document Notch / Fold Channel -->
    <polygon points="340,76 436,172 436,132 380,76" />
  </g>

  <!-- Floating Corner Flap Monolith -->
  <g fill="#000000">
    <path d="M 374 76
             C 374 116 400 142 436 142
             L 436 172
             C 382 172 344 130 344 76 Z" />

    <!-- Center Collaboration Focus Node -->
    <circle cx="256" cy="256" r="28" />
  </g>
</svg>