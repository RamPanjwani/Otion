<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowLogo" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="55%" stop-color="#0c0d13" />
      <stop offset="100%" stop-color="#07070a" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="squircleBorderL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Squircle Fill -->
    <linearGradient id="squircleFillL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f111a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leafBaseL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="leafMidL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="leafTopL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="leafFoldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="sparkleGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowShadowL" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="26" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="600" fill="url(#bgGlowLogo)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
    <line x1="1200" y1="0" x2="1200" y2="600" />
  </g>

  <!-- LEFT: ICON EMBLEM (Centered at x=320, y=300, scale=0.48) -->
  <g transform="translate(130, 110)">
    <!-- Container Squircle -->
    <g filter="url(#softShadowL)">
      <rect x="0" y="0" width="380" height="380" rx="98" ry="98" fill="url(#squircleFillL)" stroke="url(#squircleBorderL)" stroke-width="2.5" />
    </g>

    <!-- Core Glow Behind Emblem -->
    <circle cx="190" cy="190" r="160" fill="url(#coreGlowL)" />

    <!-- Scaled Emblem -->
    <g transform="translate(190, 190) scale(0.46) translate(-512, -512)" filter="url(#glowShadowL)">
      <!-- Base Note Leaf -->
      <path d="M 360 280 C 440 230, 584 230, 664 280 C 744 330, 784 430, 764 530 C 744 630, 674 720, 580 754 C 500 782, 420 760, 360 710 C 310 668, 274 598, 274 512 C 274 426, 305 320, 360 280 Z" fill="url(#leafBaseL)" />
      <!-- Ruled Texture -->
      <path d="M 390 380 Q 512 350 634 380" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 370 440 Q 512 410 654 440" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 360 500 Q 512 470 664 500" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 370 560 Q 512 530 654 560" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- Middle Leaf -->
      <path d="M 664 280 C 750 340, 770 470, 720 570 C 670 670, 560 740, 450 740 C 340 740, 260 660, 260 550 C 260 450, 330 360, 430 330 C 500 308, 590 320, 640 370 C 580 430, 480 430, 410 470 C 370 492, 350 530, 360 570 C 375 620, 430 650, 480 650 C 550 650, 610 600, 640 540 C 680 460, 660 360, 664 280 Z" fill="url(#leafMidL)" />
      <!-- Top Forward Leaf -->
      <path d="M 320 370 C 360 280, 460 250, 560 270 C 660 290, 730 370, 740 470 C 750 570, 690 660, 600 700 C 520 735, 430 720, 370 660 C 440 640, 520 620, 570 570 C 620 520, 630 450, 590 390 C 550 330, 470 320, 400 340 C 360 352, 336 362, 320 370 Z" fill="url(#leafTopL)" />
      <path d="M 320 370 Q 420 330 520 340 Q 640 355 690 440 Q 735 520 700 620" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Prism -->
      <path d="M 512 430 L 556 496 L 512 562 L 468 496 Z" fill="#ffffff" fill-opacity="0.95" />
      <path d="M 512 444 L 546 496 L 512 548 L 478 496 Z" fill="url(#leafFoldL)" />
    </g>

    <!-- Sparkle Accent -->
    <g transform="translate(285, 80)">
      <circle cx="0" cy="0" r="28" fill="url(#sparkleGlowL)" />
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#a5f3fc" />
    </g>
  </g>

  <!-- RIGHT: BRAND TYPOGRAPHY -->
  <g transform="translate(580, 0)">
    <!-- Main Title: Otion -->
    <text x="0" y="325" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="142" 
          font-weight="700" 
          letter-spacing="-0.04em" 
          fill="url(#textGradient)">
      Otion
    </text>

    <!-- Dot / Spark Accent after Title -->
    <circle cx="410" cy="235" r="9" fill="url(#accentGradient)" />

    <!-- Subtitle Pill Container -->
    <g transform="translate(2, 375)">
      <rect x="0" y="0" width="480" height="36" rx="18" fill="#1e1838" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2" />
      <text x="240" y="23" 
            text-anchor="middle"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="600" 
            letter-spacing="0.22em" 
            fill="url(#accentGradient)">
        NOTES &amp; IDEAS IN FLOW
      </text>
    </g>

    <!-- Secondary descriptive line -->
    <text x="6" y="455" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="17" 
          font-weight="400" 
          letter-spacing="0.01em" 
          fill="#94a3b8">
      Real-Time Collaborative Notes &amp; Decisions Workspace
    </text>
  </g>
</svg>
