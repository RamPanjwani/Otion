services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - otion-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: rampanjwani/otion-server:latest
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/otion
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Docker Compose}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  client:
    image: rampanjwani/otion-client:latest
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  otion-mongo:
