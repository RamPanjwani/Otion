name: Uptime check

# The free Render instance sleeps when idle, so the first request can take a
# minute. Retries keep a cold start from looking like an outage, and a real
# failure fails the run, which notifies the repository owner by email.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: API health
        run: |
          body=$(curl -sS --max-time 100 --retry 3 --retry-delay 5 --retry-all-errors \
            -w '\n%{http_code}' https://otion-api.onrender.com/api/health)
          status=$(printf '%s' "${body}" | tail -n1)
          payload=$(printf '%s' "${body}" | sed '$d')
          echo "status ${status}: ${payload}"
          test "${status}" = "200"
          test "$(printf '%s' "${payload}" | jq -r '.status')" = "ok"
          test "$(printf '%s' "${payload}" | jq -r '.database')" = "connected"

      - name: Client
        run: |
          status=$(curl -sS -o /dev/null --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors \
            -w '%{http_code}' https://otion-nine.vercel.app/)
          echo "client ${status}"
          test "${status}" = "200"
