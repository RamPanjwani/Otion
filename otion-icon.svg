<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Isolated Pure White Background (1:1 Aspect Ratio) -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- 
    Otion Ultra-Minimalist Squircle App Icon (1024x1024)
    Pure Black & White Monochromatic UI Icon
    Aesthetic: Modern, friendly, prominent rounded corners, optical safe-zone centering
    Zero gradients, zero strokes, zero blurs, zero intricate details
  -->

  <!-- Solid Black Squircle Container -->
  <rect x="128" y="128" width="768" height="768" rx="192" ry="192" fill="#000000" />

  <!-- Document Silhouette (Pure White #ffffff) -->
  <g fill="#ffffff">
    <!-- Main Note Body with Angled Fold Notch -->
    <path d="M 368 272 
             L 576 272 
             C 588 272 600 277 608 285 
             L 691 368 
             C 699 376 704 388 704 400 
             L 704 704 
             C 704 730.5 682.5 752 656 752 
             L 368 752 
             C 341.5 752 320 730.5 320 704 
             L 320 320 
             C 320 293.5 341.5 272 368 272 Z" />

    <!-- Folded Corner Flap -->
    <path d="M 596 272 
             C 596 272 596 364 596 368 
             C 596 374 602 380 608 380 
             L 704 380 
             C 704 380 616 292 596 272 Z" />
  </g>

  <!-- Precision Negative Space Channels & Flow Elements (Pure Black #000000) -->
  <g fill="#000000">
    <!-- Fold Separation Negative Space Incision -->
    <path d="M 576 264 
             L 576 392 
             C 576 400 584 408 592 408 
             L 712 408 
             L 712 388 
             L 596 388 
             L 596 264 Z" />

    <!-- Line 1: Header Note Flow Bar -->
    <rect x="384" y="472" width="256" height="44" rx="22" />

    <!-- Line 2: Note Content Flow Bar -->
    <rect x="384" y="548" width="168" height="44" rx="22" />

    <!-- Interactive Collaboration Node -->
    <circle cx="606" cy="570" r="22" />
  </g>
</svg>