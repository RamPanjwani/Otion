<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Isolated Pure White Background (1:1 Aspect Ratio) -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- 
    Otion Squircle App Icon (1024x1024)
    Circular 'O' Monogram & Collaborative Workspace Edition
    Pure Black & White Monochromatic UI Icon (#000000 & #ffffff)
    Modern, friendly, ultra-minimalist geometry with perfect micro-size legibility
  -->

  <!-- Solid Black Squircle Container -->
  <rect x="128" y="128" width="768" height="768" rx="192" ry="192" fill="#000000" />

  <!-- Circular 'O' Note Monogram (Pure White #ffffff) -->
  <g fill="#ffffff">
    <!-- Outer Circular 'O' Ring with Top-Right Fold Bevel -->
    <path fill-rule="evenodd" d="
      M 512 256 
      C 653.4 256 768 370.6 768 512 
      C 768 653.4 653.4 768 512 768 
      C 370.6 768 256 653.4 256 512 
      C 256 370.6 370.6 256 512 256 Z

      M 512 376 
      C 437 376 376 437 376 512 
      C 376 587 437 648 512 648 
      C 587 648 648 587 648 512 
      C 648 437 587 376 512 376 Z
    " />

    <!-- Top-Right Folded Corner Flap (Folded Paper Metaphor) -->
    <path d="M 648 276 
             C 648 344 700 396 768 396 
             L 768 368 
             C 712 368 668 324 668 268 
             Z" />

    <!-- Central Collaboration Focus Node (Core of the 'O' Portal) -->
    <circle cx="512" cy="512" r="32" />
  </g>

  <!-- Precision Negative Space Channels (Pure Black #000000) -->
  <g fill="#000000">
    <!-- Fold Separation Channel -->
    <path d="M 632 260 
             L 632 412 
             C 632 420 638 426 646 426 
             L 780 426 
             L 780 404 
             L 652 404 
             L 652 260 Z" />
  </g>
</svg>